# SQL Server for machines without LocalDB (Mac / Linux). See "SQL Server אחר" in README.md.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_str0ng_Pass"
    ports:
      - "1433:1433"
