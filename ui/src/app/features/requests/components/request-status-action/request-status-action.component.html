<div class="status-action">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="status-action__field">
    <mat-select
      [formControl]="control"
      [aria-label]="
        (isFinal() ? 'סטטוס סופי, לא ניתן לשינוי: ' : 'עדכון סטטוס, נוכחי: ') +
        statusLabels[status()] +
        ', עבור ' +
        requestTitle()
      "
      [attr.title]="isFinal() ? 'סטטוס סופי, לא ניתן לשינוי' : null"
    >
      @for (option of options(); track option) {
        <mat-option [value]="option">{{ statusLabels[option] }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if (pending()) {
    <mat-spinner diameter="18" aria-hidden="true" />
    <span class="sr-only" role="status">מעדכן סטטוס…</span>
  }
</div>
