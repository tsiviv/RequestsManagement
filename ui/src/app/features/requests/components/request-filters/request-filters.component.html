<form class="filters" [formGroup]="form" role="search" aria-label="Search and filter requests">
  <mat-form-field appearance="outline" class="filters__search" subscriptSizing="dynamic">
    <mat-label>Search</mat-label>
    <input
      matInput
      formControlName="search"
      placeholder="Search by title or organization"
      autocomplete="off"
    />
    <mat-icon matPrefix aria-hidden="true">search</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filters__select" subscriptSizing="dynamic">
    <mat-label>Status</mat-label>
    <mat-select formControlName="status" aria-label="Filter by status">
      <mat-option value="">All statuses</mat-option>
      @for (status of statuses; track status) {
        <mat-option [value]="status">{{ statusLabels[status] }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filters__select" subscriptSizing="dynamic">
    <mat-label>Priority</mat-label>
    <mat-select formControlName="priority" aria-label="Filter by priority">
      <mat-option value="">All priorities</mat-option>
      @for (priority of priorities; track priority) {
        <mat-option [value]="priority">{{ priorityLabels[priority] }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button
    type="button"
    mat-stroked-button
    class="filters__reset"
    (click)="resetFilters()"
    aria-label="Reset search and filters"
  >
    <mat-icon aria-hidden="true">restart_alt</mat-icon>
    Reset
  </button>
</form>
