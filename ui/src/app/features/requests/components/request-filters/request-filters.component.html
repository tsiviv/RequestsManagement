<form class="filters" [formGroup]="form" role="search" aria-label="חיפוש וסינון בקשות">
  <mat-form-field appearance="outline" class="filters__search" subscriptSizing="dynamic">
    <mat-label>חיפוש</mat-label>
    <input
      matInput
      formControlName="search"
      placeholder="חיפוש לפי כותרת או ארגון"
      autocomplete="off"
    />
    <mat-icon matPrefix aria-hidden="true">search</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filters__select" subscriptSizing="dynamic">
    <mat-label>סטטוס</mat-label>
    <mat-select formControlName="status" aria-label="סינון לפי סטטוס">
      <mat-option value="">כל הסטטוסים</mat-option>
      @for (status of statuses; track status) {
        <mat-option [value]="status">{{ statusLabels[status] }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filters__select" subscriptSizing="dynamic">
    <mat-label>עדיפות</mat-label>
    <mat-select formControlName="priority" aria-label="סינון לפי עדיפות">
      <mat-option value="">כל העדיפויות</mat-option>
      @for (priority of priorities; track priority) {
        <mat-option [value]="priority">{{ priorityLabels[priority] }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button
    type="button"
    mat-stroked-button
    class="filters__reset"
    (click)="resetFilters()"
    aria-label="איפוס חיפוש ומסננים"
  >
    <mat-icon aria-hidden="true">restart_alt</mat-icon>
    איפוס
  </button>
</form>
